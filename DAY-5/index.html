<html>

<head>
    <script>
        //Operators are special symbol or keyword that help to perform operations on variable or values.
        //Operators have Eight types in js that are following: -Arithmetic Operator to perfrom + - * / %  -Assignmenet Operator = == -Comparison Operator  -Logical Operator -Ternary Operator -Type Operator -Bitwise Operator -String Operator

        function tryOperators() {
            let a = 10;
            let b = 20;
            let c = a + b;
            alert(c)
        }
    </script>
</head>

<body>
    <h1>Operator in Javascript</h1>
    <button onclick="tryOperators()">Add Two Numbers</button>
</body>
