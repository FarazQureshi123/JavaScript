<html>
    <head>
    <script>
        function Operations(){
        let a = 10;
        let b =2;
        console.log(a+b);
        console.log(a-b);
        console.log(a*b);
        console.log(a/b);
        console.log(a%b);
        console.log(a**b);
        }
        console.log("5"+1); //string + number = number 51 + concatenate the value 
        console.log(5+"1"); // number + string = number 51 
        console.log("5"-1); // string - number = number 4 - covert string into number and do -
        console.log("5"*4);  // 20
        console.log("abc"*3);  //Nan because abc cant be converted to number here
        console.log(true+true); // true = 1 in boolean false = 0
        

    </script>
    </head>
    
    <body>
  <h1>Arithmetic Operators</h1>
  <button onclick="Operations()">Click Me</button>
    </body>
</html>
