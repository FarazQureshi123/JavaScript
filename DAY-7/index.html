<html>

<head>
    <script>
        //Assignment Operator are used to assign values to variables or update existing values
        function Operations() {
            let a = 10 //simple assign operator
            console.log(a);

            let b = 20;
            a += b;  //a+b; add and assign operator
            console.log(a);
            a -= b; // Subtract and assign
            console.log(a);
            a *= b; //Multiply and assign
            console.log(a);
            a **= b;
            console.log(a);

            //  And Operator
            a = 5; //0101
            a &= 3;  //0011
            console.log(a);  // 1

            //OR Operator
            a = 5; //0101
            a |= 3  //0011
            console.log(a); //111 = 7 

            //XOR Operator
            a = 9; // 1001
            a ^= 3; //0011
            console.log(a); //1010 = 10

            //Shift Assignment Operator
            let c = 8;
            c <<= 1; //left shift -> 16 // 10000
            c >>= 1; //Right shift -> 4 //0100
            c >>>= 1; //Unsigned right shift -> 4 //0100

        }


    </script>

</head>

<body>
    <h1>Assignment Operator in JS</h1>
    <button onclick="Operations()">Click Here</button>
</body>

</html>
